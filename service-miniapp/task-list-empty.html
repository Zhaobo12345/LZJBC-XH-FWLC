<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家装平台小程序原型 - 全部任务（空状态）</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .page-content {
            height: calc(100% - 44px - 44px);
            background-color: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-state {
            text-align: center;
            padding: 60px 24px;
        }

        .empty-state .icon {
            font-size: 56px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state .main-text {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .empty-state .sub-text {
            font-size: 13px;
            color: var(--text-tertiary);
            line-height: 1.5;
        }
    </style>
<style>
/* 微信原生胶囊占位（样式参考真机效果，由微信客户端实际渲染） */
.nav-bar .native-capsule {
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    min-width: 56px;
    height: 28px;
    padding: 0 10px;
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.7);
    color: rgba(0, 0, 0, 0.6);
    font-size: 12px;
    line-height: 1;
    user-select: none;
    box-sizing: border-box;
}
.nav-bar .native-capsule .nc-left,
.nav-bar .native-capsule .nc-right {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    min-width: 16px;
}
.nav-bar .native-capsule .nc-right {
    font-size: 10px;
}
.nav-bar .native-capsule .nc-divider {
    width: 1px;
    height: 14px;
    background: rgba(0, 0, 0, 0.1);
    margin: 0 4px;
}
    .nav-bar .native-capsule .nc-left,
    .nav-bar .native-capsule .nc-right {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 1;
        min-width: 16px;
    }
    .nav-bar .native-capsule .nc-right {
        font-size: 10px;
    }
    .nav-bar .native-capsule .nc-divider {
        width: 1px;
        height: 14px;
        background: rgba(0, 0, 0, 0.1);
        margin: 0 4px;
    }
</style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar">
            <div class="time">9:41</div>
            <div class="icons">📶 🔋</div>
        </div>
        <div class="nav-bar">
            <div class="back" onclick="location.href='project-detail-initial-v2.html'">← 返回</div>
            <div class="title centered">全部任务</div>
            
        
            <div class="actions"><div class="native-capsule" title="微信原生胶囊：由微信客户端渲染，开发者不可自定义其内容"><span class="nc-left">⋯</span><span class="nc-divider"></span><span class="nc-right">○</span></div></div>
        </div>
            

        <div class="page-content">
            <div class="empty-state">
                <div class="icon">📋</div>
                <div class="main-text">暂无任务</div>
                <div class="sub-text">在该服务流程项下拟定合同并添加任务后，任务将在此处展示</div>
            </div>
        </div>
    </div>
<script src="../shared/doc-viewer/doc-viewer.js"></script>
